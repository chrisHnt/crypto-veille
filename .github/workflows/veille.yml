name: Veille Crypto Hebdomadaire

on:
  schedule:
    - cron: "0 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run veille pipeline
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_PRESET: ${{ secrets.PERPLEXITY_PRESET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OUTPUT_DIR: ./notes
        run: python scripts/veille.py
      - name: Commit and push note
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/ docs/ rejected/
          git diff --cached --quiet || git commit -m "📰 Veille crypto — $(date +'%Y-%m-%d')"
          # En cas de push concurrent (ex. commit manuel pendant le run), on se
          # resynchronise et on retente une fois plutôt que d'échouer.
          for i in 1 2 3; do
            git push && break
            git pull --rebase
          done
